<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Informasi Kepegawaian Kecamatan</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --biru-muda: #e0f2fe;
            --biru-utama: #0284c7;
            --biru-gelap: #0369a1;
            --teks-gelap: #1e293b;
            --putih: #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: var(--biru-muda);
            color: var(--teks-gelap);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: var(--putih);
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(2, 132, 199, 0.1);
            text-align: center;
        }

        header h1 {
            font-size: 24px;
            color: var(--biru-gelap);
            margin-bottom: 5px;
            font-weight: 600;
        }

        header p {
            font-size: 14px;
            color: #64748b;
            margin-bottom: 40px;
        }

        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
        }

        .menu-card {
            background: var(--putih);
            border: 2px solid #f0fdf4;
            padding: 30px 20px;
            border-radius: 15px;
            text-decoration: none;
            color: var(--teks-gelap);
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.02);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .menu-card i {
            font-size: 40px;
            color: var(--biru-utama);
            margin-bottom: 15px;
            transition: transform 0.3s ease;
        }

        .menu-card span {
            font-weight: 600;
            font-size: 16px;
        }

        /* Efek Hover (Ketika Kursor di Atas Menu) */
        .menu-card:hover {
            background-color: var(--biru-utama);
            border-color: var(--biru-utama);
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(2, 132, 199, 0.2);
        }

        .menu-card:hover i, .menu-card:hover span {
            color: var(--putih);
        }

        .menu-card:hover i {
            transform: scale(1.1);
        }

        footer {
            margin-top: 40px;
            font-size: 12px;
            color: #94a3b8;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Sistem Kepegawaian Kecamatan</h1>
            <p>Silakan pilih menu di bawah untuk mengakses layanan (Akan membuka tab baru)</p>
        </header>

        <main class="menu-grid">
            <a href="https://https://docs.google.com/spreadsheets/d/1mrcXnoFrc1iwA6ey4l0ZcW5El-7lsWgBgfsfTAIeMX8/edit?resourcekey=&gid=1298972298#gid=1298972298" target="_blank" class="menu-card">
                <i class="fa-solid fa-calendar-days"></i>
                <span>Jadwal Pendopo</span>
            </a>

            <a href="https://https://docs.google.com/spreadsheets/d/1E4Qy0mubFsFjoFlakJ93vH-CYbc2okf40_iM6fChXn4/edit?gid=855762182#gid=855762182" target="_blank" class="menu-card">
                <i class="fa-solid fa-comments-edge"></i>
                <i class="fa-solid fa-bullhorn"></i>
                <span>Aduan Pelayanan</span>
            </a>

            <a href="https://https://docs.google.com/spreadsheets/d/1J7OxTn45mKSfQD6KI80arANLGxG5FXmGNjyjEv0tDf0/edit?gid=0#gid=0" target="_blank" class="menu-card">
                <i class="fa-solid fa-user-clock"></i>
                <span>Monitoring Pensiun</span>
            </a>
        </main>

        <footer>
            &copy; 2026 Pelayanan Kepegawaian Kecamatan. All Rights Reserved.
        </footer>
    </div>

</body>
</html>
